services:
  mf-remote-a:
    build:
      context: ./nx-mf-df
      dockerfile: ../Dockerfile
    container_name: nx-mf-remote-a
    ports:
      - "4201:4201"
    volumes:
      - ./nx-mf-df:/workspace
      - node_modules_remote_a:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: pnpm nx serve mf_remote_a
    networks:
      - nx-mf-network
    restart: unless-stopped
    tty: true
    stdin_open: true

  mf-remote-b:
    build:
      context: ./nx-mf-df
      dockerfile: ../Dockerfile
    container_name: nx-mf-remote-b
    ports:
      - "4202:4202"
    volumes:
      - ./nx-mf-df:/workspace
      - node_modules_remote_b:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: pnpm nx serve mf_remote_b
    networks:
      - nx-mf-network
    restart: unless-stopped
    tty: true
    stdin_open: true

  mf-remote-home:
    build:
      context: ./nx-mf-df
      dockerfile: ../Dockerfile
    container_name: nx-mf-remote-home
    ports:
      - "4203:4203"
    volumes:
      - ./nx-mf-df:/workspace
      - node_modules_remote_home:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: pnpm nx serve mf_remote_home
    networks:
      - nx-mf-network
    restart: unless-stopped
    tty: true
    stdin_open: true

  main-host:
    build:
      context: ./nx-mf-df
      dockerfile: ../Dockerfile
    container_name: nx-mf-main-host
    ports:
      - "4200:4200"
    volumes:
      - ./nx-mf-df:/workspace
      - node_modules_main:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    command: pnpm nx serve main-host
    depends_on:
      - mf-remote-a
      - mf-remote-b
      - mf-remote-home
    networks:
      - nx-mf-network
    restart: unless-stopped
    tty: true
    stdin_open: true

networks:
  nx-mf-network:
    driver: bridge

volumes:
  node_modules_remote_a:
  node_modules_remote_b:
  node_modules_remote_home:
  node_modules_main:
